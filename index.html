    <!-- Theme: pasang mode gelap sebelum render agar tidak kedip -->

      try {
        var t = localStorage.getItem("portfolio-theme-v1");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
